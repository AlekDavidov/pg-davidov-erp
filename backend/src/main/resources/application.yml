spring:
  application:
    name: pg-davidov-erp

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pg_davidov_erp}
    username: ${DB_USER:pgdavidov}
    password: ${DB_PASSWORD:pgdavidov}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  document-storage:
    location: ${DOCUMENT_STORAGE_LOCATION:./storage/documents}
    max-file-size-bytes: 10485760