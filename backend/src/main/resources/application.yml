spring:
  application:
    name: pg-davidov-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pg_davidov_erp}
    username: ${DB_USER:pgdavidov}
    password: ${DB_PASSWORD:pgdavidov}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
