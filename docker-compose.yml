name: pg-davidov-erp
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pg_davidov_erp}
      POSTGRES_USER: ${POSTGRES_USER:-pgdavidov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgdavidov}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgdavidov} -d ${POSTGRES_DB:-pg_davidov_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pg_davidov_erp}
      DB_USER: ${POSTGRES_USER:-pgdavidov}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pgdavidov}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    ports: ["8081:80"]
    depends_on:
      backend: {condition: service_healthy}
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pgdavidov.rs}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      DOCUMENT_STORAGE_LOCATION: /app/storage/documents
    ports: ["5050:80"]
    volumes: ["pgadmin_data:/var/lib/pgadmin"]
    volumes:
      - document_storage:/app/storage/documents
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
  pgadmin_data:
volumes:
  document_storage:
