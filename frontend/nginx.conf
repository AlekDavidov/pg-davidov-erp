server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8090/api/;
    }

    location /actuator/ {
        proxy_pass http://backend:8090/actuator/;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8090/swagger-ui/;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8090/v3/api-docs;
    }
}